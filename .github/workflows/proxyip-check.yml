name: ProxyIP Check

concurrency:
  group: proxyip-update
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/20 * * * *"   # 按需改
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run checker
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python scripts/check_proxyip.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add public/proxyips.json data/history.json
          git commit -m "Update proxyips" || exit 0
          git push
